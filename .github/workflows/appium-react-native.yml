name: 4. Appium E2E Testing (React Native)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  appium-react-native:
    runs-on: macos-latest # Best for running iOS/Android emulators
    
    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v3

    - name: 2. Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: 3. Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: 4. Setup Android SDK
      uses: android-actions/setup-android@v2
        
    - name: 5. & 6. Create & Start Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: default
        arch: x86_64
        profile: pixel_4
        script: echo "Emulator started successfully"

    - name: 7. Install Appium & React Native Driver
      run: |
        npm install -g appium
        appium driver install uiautomator2

    - name: 8. Install Test Dependencies
      working-directory: tests/mobile
      run: npm install

    - name: 9. Install APK (Handled by Appium desired capabilities)
      run: echo "APK will be installed via Appium configuration."

    - name: 10. Run Tests (300 Test Cases Generation)
      working-directory: tests/mobile
      run: |
        appium &
        sleep 10
        npm run test

    - name: 11. Generate Reports
      working-directory: tests/mobile
      run: node src/utils/ExcelReporter.js
        
    - name: 12. Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: Appium-React-Native-Reports
        path: |
          tests/mobile/reports/
          tests/mobile/GeneRx_React_Native_E2E_Report.xlsx
