name: React Native E2E Testing Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  appium-test:
    runs-on: macos-latest # Using macos for HAXM/Emulator acceleration support

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Appium & Dependencies
        run: |
          npm install -g appium
          appium driver install uiautomator2
          npm install

      - name: Start Appium Server
        run: appium &
        env:
          APPIUM_PORT: 4723

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          script: npm run test:appium

      - name: Generate Reports
        run: npm run report:excel
        if: always()

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: GeneRx-QA-Reports
          path: |
            reports/GeneRx_E2E_Report.xlsx
            reports/failures/
            reports/logs/
